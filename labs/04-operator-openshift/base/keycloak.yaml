apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: sso
  namespace: keycloak
spec:
  instances: 2

  db:
    vendor: postgres
    host: postgres.keycloak.svc.cluster.local
    database: keycloak
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password

  http:
    httpEnabled: true

  ingress:
    enabled: false

  hostname:
    hostname: sso.example.local

  additionalOptions:
    - name: health-enabled
      value: "true"
    - name: metrics-enabled
      value: "true"

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
