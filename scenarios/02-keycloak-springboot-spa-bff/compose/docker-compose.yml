services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command:
      - start-dev
      - --http-enabled=true
      - --hostname-strict=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "8080:8080"

  resource-server-placeholder:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:5678", "-text=REFERENCE_ONLY-resource-server"]
    ports:
      - "8085:5678"

  web-client-placeholder:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:5678", "-text=REFERENCE_ONLY-web-client"]
    ports:
      - "8086:5678"

  bff-placeholder:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:5678", "-text=REFERENCE_ONLY-bff"]
    ports:
      - "8087:5678"
