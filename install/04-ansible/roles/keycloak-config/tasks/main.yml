---
# Auteur : Zidane Djamal
# Description : Tâches de configuration de Keycloak et démarrage du service systemd

- name: Déploiement du fichier de configuration keycloak.conf
  ansible.builtin.template:
    src: keycloak.conf.j2
    dest: "{{ keycloak_home }}/conf/keycloak.conf"
    owner: "{{ keycloak_user }}"
    group: "{{ keycloak_user }}"
    mode: "0640"
  notify: Redémarrer Keycloak

- name: Construction de Keycloak (optimisation du démarrage)
  ansible.builtin.command:
    cmd: "{{ keycloak_home }}/bin/kc.sh build"
  become_user: "{{ keycloak_user }}"
  register: kc_build_output
  changed_when: "'Build of Keycloak' in kc_build_output.stdout"

- name: Déploiement du service systemd pour Keycloak
  ansible.builtin.template:
    src: keycloak.service.j2
    dest: /etc/systemd/system/keycloak.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Recharger systemd
    - Redémarrer Keycloak

- name: Activation et démarrage du service Keycloak
  ansible.builtin.systemd:
    name: keycloak
    state: started
    enabled: true
    daemon_reload: true

- name: Attente que Keycloak soit prêt (health/ready)
  ansible.builtin.uri:
    url: "http://localhost:{{ keycloak_management_port }}/health/ready"
    method: GET
    status_code: 200
  register: health_check
  retries: 30
  delay: 10
  until: health_check.status == 200

- name: Affichage de l'état de santé de Keycloak
  ansible.builtin.debug:
    msg: "Keycloak est opérationnel sur {{ inventory_hostname }}"
