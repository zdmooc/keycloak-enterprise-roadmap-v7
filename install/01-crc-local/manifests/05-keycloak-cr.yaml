apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak-system
spec:
  instances: 1

  db:
    vendor: postgres
    host: postgresql
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password

  http:
    httpEnabled: true

  hostname:
    hostname: keycloak.apps-crc.testing

  ingress:
    enabled: true
    className: openshift-default

  proxy:
    headers: xforwarded

  resources:
    requests:
      memory: 1Gi
      cpu: 50m
    limits:
      memory: 2Gi
      cpu: "1"

# CRC local compact scheduling note:
# cpu request 50m is intentionally lab-only so the single-node CRC can schedule
# Keycloak when other retained POCs already reserve most allocatable CPU.
# The 1 CPU limit remains available for startup/runtime burst.
# This is not a production sizing recommendation.
